<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CySA Simulation Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="principles.js"></script>
    <script src="scenarios/manifest.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains+Mono', monospace;
        }
        .terminal-glow {
            box-shadow: inset 0 0 10px rgba(34, 197, 94, 0.2);
        }
        .asset-card.active {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            background-color: rgba(30, 41, 59, 1);
        }
        .log-container::-webkit-scrollbar, .scrollable-list::-webkit-scrollbar {
            width: 8px;
        }
        .log-container::-webkit-scrollbar-track, .scrollable-list::-webkit-scrollbar-track {
            background: #000;
        }
        .log-container::-webkit-scrollbar-thumb, .scrollable-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .log-container::-webkit-scrollbar-thumb:hover, .scrollable-list::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .checkbox-item:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }
        .checkbox-item.selected {
            background-color: rgba(59, 130, 246, 0.2);
            border-left: 4px solid #3b82f6;
        }
        .feedback-correct {
            background-color: rgba(34, 197, 94, 0.4) !important;
            border: 2px solid #22c55e !important;
        }
        .feedback-incorrect {
            background-color: rgba(239, 68, 68, 0.4) !important;
            border: 2px solid #ef4444 !important;
        }
        .feedback-missing {
            background-color: rgba(234, 179, 8, 0.1) !important;
            border-color: #eab308 !important;
            border-style: dashed !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="border-b border-slate-700 bg-slate-800 px-6 py-4 flex justify-between items-center z-50">
        <div class="flex items-center gap-3">
            <i data-lucide="shield-check" class="text-blue-500 w-8 h-8"></i>
            <h1 class="text-xl font-bold tracking-tight">CompTIA Simulation Sandbox</h1>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="startRandomInvestigation()" class="bg-blue-600 hover:bg-blue-500 text-sm font-bold py-1.5 px-4 rounded transition-colors flex items-center gap-2">
                <i data-lucide="shuffle" class="w-4 h-4"></i>
                Random Case
            </button>
            <div class="h-6 w-px bg-slate-700"></div>
            <label for="scenario-select" class="text-sm font-medium text-slate-400 uppercase tracking-wider">Case:</label>
            <select id="scenario-select" class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <!-- Options populated via JS -->
            </select>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">

        <!-- Left Column: Assets & Logs -->
        <section class="w-[60%] flex flex-col border-r border-slate-700 p-6 overflow-y-auto">
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i data-lucide="layout-grid" class="w-5 h-5 text-slate-400"></i>
                    Network Observation Nodes
                </h2>
                <div class="grid grid-cols-5 gap-4" id="asset-grid">
                    <button onclick="selectAsset('proxy')" id="asset-proxy" class="asset-card flex flex-col items-center justify-center p-3 bg-slate-800 border border-slate-700 rounded-lg hover:border-slate-500 transition-all group">
                        <i data-lucide="globe" class="w-6 h-6 mb-1 text-slate-400 group-hover:text-blue-400"></i>
                        <span class="text-xs font-medium">Web Gateway</span>
                    </button>
                    <button onclick="selectAsset('email')" id="asset-email" class="asset-card flex flex-col items-center justify-center p-3 bg-slate-800 border border-slate-700 rounded-lg hover:border-slate-500 transition-all group">
                        <i data-lucide="mail" class="w-6 h-6 mb-1 text-slate-400 group-hover:text-blue-400"></i>
                        <span class="text-xs font-medium">Mail Exchange</span>
                    </button>
                    <button onclick="selectAsset('file_server')" id="asset-file_server" class="asset-card flex flex-col items-center justify-center p-3 bg-slate-800 border border-slate-700 rounded-lg hover:border-slate-500 transition-all group">
                        <i data-lucide="hard-drive" class="w-6 h-6 mb-1 text-slate-400 group-hover:text-blue-400"></i>
                        <span class="text-xs font-medium">File Repo</span>
                    </button>
                    <button onclick="selectAsset('workstations')" id="asset-workstations" class="asset-card flex flex-col items-center justify-center p-3 bg-slate-800 border border-slate-700 rounded-lg hover:border-slate-500 transition-all group">
                        <i data-lucide="monitor" class="w-6 h-6 mb-1 text-slate-400 group-hover:text-blue-400"></i>
                        <span class="text-xs font-medium">Endpoints</span>
                    </button>
                    <button onclick="selectAsset('auth_logs')" id="asset-auth_logs" class="asset-card flex flex-col items-center justify-center p-3 bg-slate-800 border border-slate-700 rounded-lg hover:border-slate-500 transition-all group">
                        <i data-lucide="key" class="w-6 h-6 mb-1 text-slate-400 group-hover:text-blue-400"></i>
                        <span class="text-xs font-medium">Auth Logs</span>
                    </button>
                </div>
            </div>

            <div class="flex-1 flex flex-col min-h-[400px]">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i data-lucide="terminal" class="w-5 h-5 text-slate-400"></i>
                    Log Stream - <span id="active-asset-label" class="text-blue-400">Web Gateway</span>
                </h2>
                <div class="flex-1 bg-black rounded-lg border border-slate-700 p-4 font-mono text-sm text-green-400 overflow-y-auto log-container terminal-glow" id="log-terminal">
                    <!-- Logs populated here -->
                </div>
            </div>
        </section>

        <!-- Right Column: Incident Assessment -->
        <section class="w-[40%] p-6 flex flex-col overflow-y-auto bg-slate-900/50">
            <div class="flex-1">
                <h2 class="text-lg font-semibold mb-2 flex items-center gap-2">
                    <i data-lucide="clipboard-list" class="w-5 h-5 text-slate-400"></i>
                    Assessment Panel
                </h2>
                <div class="mb-6 flex items-center gap-2">
                    <div id="scenario-hint" class="text-xs text-blue-400 border border-blue-400/30 bg-blue-400/10 px-2 py-1 rounded cursor-help flex items-center gap-1.5 transition-all hover:bg-blue-400/20" title="Initializing investigation...">
                        <i id="hint-icon" data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                        <span id="hint-text">Mouseover for hint</span>
                    </div>
                </div>

                <div id="questions-container" class="space-y-6 mb-8">
                    <!-- Questions generated here -->
                </div>

                <div class="border-t border-slate-700 pt-6">
                    <h3 class="text-sm font-bold text-slate-300 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="check-square" class="w-4 h-4 text-blue-500"></i>
                        CySA+ Principles Observed
                    </h3>
                    <div id="principles-checklist" class="bg-slate-800 border border-slate-700 rounded-lg overflow-y-auto flex flex-col min-h-[200px] max-h-[400px] scrollable-list">
                        <!-- Checklist generated here -->
                    </div>
                </div>

                <div class="mt-8">
                    <button id="submit-btn" onclick="submitAnalysis()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="send" class="w-5 h-5"></i>
                        Submit Final Analysis
                    </button>
                </div>

                <div id="feedback-section" class="mt-6 hidden">
                    <div id="feedback-banner" class="p-4 rounded-lg border mb-4">
                        <h3 id="feedback-title" class="font-bold mb-1">Results</h3>
                        <p id="feedback-msg" class="text-sm"></p>
                    </div>
                    <div class="bg-slate-800 border border-slate-700 p-4 rounded-lg">
                        <h4 class="text-xs uppercase tracking-widest text-slate-500 font-bold mb-2">Technical Debrief</h4>
                        <p id="explanation-text" class="text-sm leading-relaxed text-slate-300"></p>
                    </div>
                    <button onclick="resetScenario()" class="mt-4 w-full border border-slate-600 hover:bg-slate-800 text-slate-300 py-2 rounded-lg text-sm transition-all">
                        Restart Investigation
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        let state = {
            currentScenarioId: null,
            activeAsset: 'proxy',
            answers: {},
            selectedPrinciples: [],
            isSubmitted: false,
            currentCasePrinciples: []
        };

        const assetLabels = {
            proxy: "Web Gateway",
            email: "Mail Exchange",
            file_server: "File Repo",
            workstations: "Endpoints",
            auth_logs: "Auth Logs"
        };

        async function init() {
            try {
                if (typeof scenarioManifest === 'undefined') {
                    console.error("scenarios/manifest.js not loaded!");
                    return;
                }

                // Dynamically load each scenario from the manifest
                const loadPromises = scenarioManifest.map(filename => {
                    return new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = `scenarios/${filename}`;
                        script.onload = resolve;
                        script.onerror = reject;
                        document.head.appendChild(script);
                    });
                });

                await Promise.all(loadPromises);

                // Sort scenarios based on the order in the manifest for deterministic UI
                const manifestOrder = scenarioManifest.map(f => f.replace('.js', ''));
                scenarios.sort((a, b) => {
                    const nameA = a.id.replace('ir-scenario-2026-', '').replace(/-/g, '_');
                    const nameB = b.id.replace('ir-scenario-2026-', '').replace(/-/g, '_');
                    return manifestOrder.indexOf(nameA) - manifestOrder.indexOf(nameB);
                });

                if (typeof scenarios === 'undefined' || scenarios.length === 0) {
                    console.error("No scenarios loaded!");
                    return;
                }

                populateScenarioDropdown();
                loadScenario(scenarios[0].id);
                if (window.lucide) lucide.createIcons();
            } catch (err) {
                console.error("Init fail:", err);
            }
        }

        function populateScenarioDropdown() {
            const select = document.getElementById('scenario-select');
            if (!select) return;
            select.innerHTML = scenarios.map((s, idx) => `<option value="${s.id}">Case ${String(idx + 1).padStart(2, '0')}</option>`).join('');
            select.addEventListener('change', (e) => loadScenario(e.target.value));
        }

        function startRandomInvestigation() {
            const randomIndex = Math.floor(Math.random() * scenarios.length);
            const scenario = scenarios[randomIndex];
            document.getElementById('scenario-select').value = scenario.id;
            loadScenario(scenario.id);
        }

        function loadScenario(id) {
            const scenario = scenarios.find(s => s.id === id);
            state.currentScenarioId = id;
            state.activeAsset = 'proxy';
            state.answers = {};
            state.selectedPrinciples = [];
            state.isSubmitted = false;

            // Build dynamic principles list for this case
            const scenarioPrinciples = scenario.principles || [];
            state.currentCasePrinciples = Array.from(new Set([...MASTER_PRINCIPLES, ...scenarioPrinciples]));

            // Reset hint
            const hint = document.getElementById('scenario-hint');
            hint.title = scenario.description;
            hint.classList.remove('bg-green-500/10', 'border-green-500/30', 'text-green-400');
            hint.classList.add('bg-blue-400/10', 'border-blue-400/30', 'text-blue-400');
            document.getElementById('hint-text').textContent = "Mouseover for hint";
            document.getElementById('hint-icon').setAttribute('data-lucide', 'help-circle');

            document.getElementById('feedback-section').classList.add('hidden');

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            renderQuestions(scenario);
            renderChecklist();
            selectAsset('proxy');
            if (window.lucide) lucide.createIcons();
        }

        function renderQuestions(scenario) {
            const container = document.getElementById('questions-container');
            if (!container) return;

            container.innerHTML = Object.entries(scenario.questions).map(([key, q]) => {
                let inputHtml = '';
                if (q.type === 'select') {
                    inputHtml = `
                        <select onchange="updateAnswer('${key}', this.value)" id="input-${key}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                            <option value="" disabled selected>Select findings...</option>
                            ${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                        </select>
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    `;
                } else if (q.type === 'number') {
                    inputHtml = `<input type="number" placeholder="Value..." onchange="updateAnswer('${key}', parseInt(this.value))" id="input-${key}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">`;
                }

                return `
                    <div class="question-block" id="q-block-${key}">
                        <label class="block text-sm font-medium text-slate-300 mb-2">${q.label}</label>
                        <div class="relative">
                            ${inputHtml}
                            <div id="icon-${key}" class="absolute -right-8 top-1/2 -translate-y-1/2"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderChecklist() {
            const container = document.getElementById('principles-checklist');
            if (!container) return;

            container.innerHTML = state.currentCasePrinciples.map((p, idx) => `
                <div onclick="togglePrinciple('${p}')" id="p-item-${idx}" class="checkbox-item flex items-center gap-3 p-3 border-b border-slate-700/50 cursor-pointer transition-all">
                    <div id="p-check-${idx}" class="w-5 h-5 border-2 border-slate-600 rounded flex items-center justify-center transition-all"></div>
                    <span id="p-text-${idx}" class="text-sm text-slate-300">${p}</span>
                    <div id="p-feedback-${idx}" class="ml-auto"></div>
                </div>
            `).join('');
        }

        function togglePrinciple(p) {
            if (state.isSubmitted) return;

            const idx = state.currentCasePrinciples.indexOf(p);
            const check = document.getElementById(`p-check-${idx}`);
            const item = document.getElementById(`p-item-${idx}`);

            if (state.selectedPrinciples.includes(p)) {
                state.selectedPrinciples = state.selectedPrinciples.filter(item => item !== p);
                check.classList.remove('bg-blue-600', 'border-blue-600');
                check.innerHTML = '';
                item.classList.remove('selected');
            } else {
                state.selectedPrinciples.push(p);
                check.classList.add('bg-blue-600', 'border-blue-600');
                check.innerHTML = '<i data-lucide="check" class="w-3 h-3 text-white"></i>';
                item.classList.add('selected');
                if (window.lucide) lucide.createIcons();
            }
        }

        function selectAsset(assetKey) {
            state.activeAsset = assetKey;
            document.querySelectorAll('.asset-card').forEach(card => card.classList.remove('active'));
            document.getElementById(`asset-${assetKey}`).classList.add('active');
            document.getElementById('active-asset-label').textContent = assetLabels[assetKey];

            const terminal = document.getElementById('log-terminal');
            const scenario = scenarios.find(s => s.id === state.currentScenarioId);
            const logs = scenario.logs[assetKey] || ["No traffic detected."];
            terminal.innerHTML = logs.map(line => `<div class="mb-1 border-b border-white/5 pb-1 last:border-0">> ${line}</div>`).join('');
            terminal.scrollTop = 0;
        }

        function updateAnswer(key, value) {
            state.answers[key] = value;
        }

        function submitAnalysis() {
            const scenario = scenarios.find(s => s.id === state.currentScenarioId);
            const questionKeys = Object.keys(scenario.questions);

            state.isSubmitted = true;

            // Validate questions
            questionKeys.forEach(key => {
                const input = document.getElementById(`input-${key}`);
                const icon = document.getElementById(`icon-${key}`);
                const qBlock = document.getElementById(`q-block-${key}`);
                const correctValue = scenario.questions[key].correct;
                const isCorrect = state.answers[key] === correctValue;

                if (isCorrect) {
                    input.classList.add('border-green-500', 'bg-green-900/80', 'text-green-100', 'font-bold');
                    icon.innerHTML = '<i data-lucide="check-circle" class="text-green-500 w-5 h-5"></i>';
                } else {
                    input.classList.add('border-red-500', 'bg-red-900/80', 'text-red-100', 'font-bold');
                    icon.innerHTML = '<i data-lucide="x-circle" class="text-red-500 w-5 h-5"></i>';

                    const correctMarker = document.createElement('div');
                    correctMarker.className = "text-[10px] font-bold text-green-400 mt-1.5 flex items-center gap-1 uppercase tracking-wider bg-green-400/10 py-1 px-2 rounded border border-green-400/20";
                    correctMarker.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i> Correct: ${correctValue}`;
                    qBlock.appendChild(correctMarker);
                }
            });

            // Validate principles
            state.currentCasePrinciples.forEach((p, idx) => {
                const feedback = document.getElementById(`p-feedback-${idx}`);
                const item = document.getElementById(`p-item-${idx}`);
                const check = document.getElementById(`p-check-${idx}`);
                const text = document.getElementById(`p-text-${idx}`);

                const shouldBeSet = scenario.principles.includes(p);
                const isSet = state.selectedPrinciples.includes(p);

                item.classList.remove('selected');

                if (shouldBeSet && isSet) {
                    // CORRECT SELECTION
                    item.classList.add('feedback-correct');
                    text.classList.add('text-green-400', 'font-bold');
                    check.className = "w-5 h-5 border-2 border-green-500 bg-green-500 rounded flex items-center justify-center transition-all";
                    check.innerHTML = '<i data-lucide="check" class="w-3 h-3 text-white"></i>';
                    feedback.innerHTML = '<i data-lucide="check-circle" class="text-green-500 w-5 h-5"></i>';
                } else if (shouldBeSet && !isSet) {
                    // MISSED PRINCIPLE
                    item.classList.add('feedback-missing');
                    text.classList.add('text-yellow-400');
                    check.className = "w-5 h-5 border-2 border-yellow-500 border-dashed rounded flex items-center justify-center transition-all";
                    feedback.innerHTML = '<span class="text-[10px] bg-yellow-500/20 text-yellow-500 px-2 py-0.5 rounded font-bold uppercase">Missing</span>';
                } else if (!shouldBeSet && isSet) {
                    // INCORRECT SELECTION
                    item.classList.add('feedback-incorrect');
                    text.classList.add('text-red-400', 'line-through');
                    check.className = "w-5 h-5 border-2 border-red-500 bg-red-500 rounded flex items-center justify-center transition-all";
                    check.innerHTML = '<i data-lucide="x" class="w-3 h-3 text-white"></i>';
                    feedback.innerHTML = '<i data-lucide="x-circle" class="text-red-500 w-5 h-5"></i>';
                }
            });

            // Update hint to explanation
            const hint = document.getElementById('scenario-hint');
            hint.title = scenario.explanation;
            hint.classList.remove('bg-blue-400/10', 'border-blue-400/30', 'text-blue-400');
            hint.classList.add('bg-green-500/10', 'border-green-500/30', 'text-green-400');
            document.getElementById('hint-text').textContent = "Mouseover for explanation";
            document.getElementById('hint-icon').setAttribute('data-lucide', 'info');

            const feedbackSection = document.getElementById('feedback-section');
            feedbackSection.classList.remove('hidden');
            document.getElementById('explanation-text').textContent = scenario.explanation;

            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').classList.add('opacity-50', 'cursor-not-allowed');

            if (window.lucide) lucide.createIcons();
            feedbackSection.scrollIntoView({ behavior: 'smooth' });
        }

        function resetScenario() {
            loadScenario(state.currentScenarioId);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

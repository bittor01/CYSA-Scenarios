<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA Simulation Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains+Mono', monospace;
        }
        .terminal-glow {
            box-shadow: inset 0 0 10px rgba(34, 197, 94, 0.2);
        }
        .asset-card.active {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            background-color: rgba(30, 41, 59, 1);
        }
        /* Custom scrollbar for terminal */
        .log-container::-webkit-scrollbar {
            width: 8px;
        }
        .log-container::-webkit-scrollbar-track {
            background: #000;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .log-container::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="border-b border-slate-700 bg-slate-800 px-6 py-4 flex justify-between items-center z-50">
        <div class="flex items-center gap-3">
            <i data-lucide="shield-check" class="text-blue-500 w-8 h-8"></i>
            <h1 class="text-xl font-bold tracking-tight">CompTIA Simulation Sandbox</h1>
        </div>
        <div class="flex items-center gap-4">
            <label for="scenario-select" class="text-sm font-medium text-slate-400 uppercase tracking-wider">Active Scenario:</label>
            <select id="scenario-select" class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <!-- Options populated via JS -->
            </select>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">

        <!-- Left Column: Assets & Logs -->
        <section class="w-[65%] flex flex-col border-r border-slate-700 p-6 overflow-y-auto">
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i data-lucide="layout-grid" class="w-5 h-5 text-slate-400"></i>
                    Asset Network
                </h2>
                <div class="grid grid-cols-4 gap-4" id="asset-grid">
                    <button onclick="selectAsset('proxy')" id="asset-proxy" class="asset-card flex flex-col items-center justify-center p-4 bg-slate-800 border border-slate-700 rounded-lg hover:border-slate-500 transition-all group">
                        <i data-lucide="server" class="w-8 h-8 mb-2 text-slate-400 group-hover:text-blue-400"></i>
                        <span class="text-sm font-medium">Proxy Server</span>
                    </button>
                    <button onclick="selectAsset('email')" id="asset-email" class="asset-card flex flex-col items-center justify-center p-4 bg-slate-800 border border-slate-700 rounded-lg hover:border-slate-500 transition-all group">
                        <i data-lucide="mail" class="w-8 h-8 mb-2 text-slate-400 group-hover:text-blue-400"></i>
                        <span class="text-sm font-medium">Email Server</span>
                    </button>
                    <button onclick="selectAsset('file_server')" id="asset-file_server" class="asset-card flex flex-col items-center justify-center p-4 bg-slate-800 border border-slate-700 rounded-lg hover:border-slate-500 transition-all group">
                        <i data-lucide="hard-drive" class="w-8 h-8 mb-2 text-slate-400 group-hover:text-blue-400"></i>
                        <span class="text-sm font-medium">File Server</span>
                    </button>
                    <button onclick="selectAsset('workstations')" id="asset-workstations" class="asset-card flex flex-col items-center justify-center p-4 bg-slate-800 border border-slate-700 rounded-lg hover:border-slate-500 transition-all group">
                        <i data-lucide="monitor" class="w-8 h-8 mb-2 text-slate-400 group-hover:text-blue-400"></i>
                        <span class="text-sm font-medium">Workstations</span>
                    </button>
                </div>
            </div>

            <div class="flex-1 flex flex-col min-h-[400px]">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i data-lucide="terminal" class="w-5 h-5 text-slate-400"></i>
                    Log Terminal - <span id="active-asset-label" class="text-blue-400">Proxy Server</span>
                </h2>
                <div class="flex-1 bg-black rounded-lg border border-slate-700 p-4 font-mono text-sm text-green-400 overflow-y-auto log-container terminal-glow" id="log-terminal">
                    <!-- Logs populated here -->
                </div>
            </div>
        </section>

        <!-- Right Column: Incident Assessment -->
        <section class="w-[35%] p-6 flex flex-col overflow-y-auto bg-slate-900/50">
            <div class="sticky top-0">
                <h2 class="text-lg font-semibold mb-2 flex items-center gap-2">
                    <i data-lucide="clipboard-list" class="w-5 h-5 text-slate-400"></i>
                    Incident Assessment
                </h2>
                <p id="scenario-desc" class="text-sm text-slate-400 mb-6 italic">
                    Loading scenario...
                </p>

                <div id="questions-container" class="space-y-6">
                    <!-- Questions generated here -->
                </div>

                <div class="mt-8 pt-6 border-t border-slate-700">
                    <button id="submit-btn" onclick="submitAnalysis()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="send" class="w-5 h-5"></i>
                        Submit Analysis
                    </button>
                </div>

                <div id="feedback-section" class="mt-6 hidden">
                    <div id="feedback-banner" class="p-4 rounded-lg border mb-4">
                        <h3 id="feedback-title" class="font-bold mb-1">Results</h3>
                        <p id="feedback-msg" class="text-sm"></p>
                    </div>
                    <div class="bg-slate-800 border border-slate-700 p-4 rounded-lg">
                        <h4 class="text-xs uppercase tracking-widest text-slate-500 font-bold mb-2">Architectural Explanation</h4>
                        <p id="explanation-text" class="text-sm leading-relaxed text-slate-300"></p>
                    </div>
                    <button onclick="resetScenario()" class="mt-4 w-full border border-slate-600 hover:bg-slate-800 text-slate-300 py-2 rounded-lg text-sm transition-all">
                        Reset Scenario
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const scenarios = [
            {
                id: "scen-01",
                title: "Scenario 1: Unauthorized Exfiltration",
                description: "Alert: High volume outbound data transfers detected outside core business hours.",
                logs: {
                    proxy: [
                        "2026-05-29 02:14:10 | 10.10.4.52 -> 192.0.2.115:443 | POST /upload HTTP/1.1 | 200 | 4.2GB",
                        "2026-05-29 02:15:00 | 10.10.4.52 -> 192.0.2.115:443 | POST /upload HTTP/1.1 | 200 | 3.8GB"
                    ],
                    email: [
                        "2026-05-29 01:00:00 | Inbound | From: external-sender@unknown.com | To: d.jones@company.com | Clean",
                        "No anomalous mail logs within target timeframe."
                    ],
                    file_server: [
                        "2026-05-29 01:45:12 | User: d.jones | IP: 10.10.4.52 | Read/Copy | S:\\Finances\\Q2_Proprietary_Data.csv",
                        "2026-05-29 01:46:01 | User: d.jones | IP: 10.10.4.52 | Read/Copy | S:\\R&D\\Blueprints_2026.tar.gz"
                    ],
                    workstations: [
                        "Host: WKSTN-452 | IP: 10.10.4.52 | Active User: d.jones",
                        "Event ID 4624: Successful Logon | Type 3 (Network) | Source: 10.10.4.52"
                    ]
                },
                questions: {
                    vector: {
                        label: "What was the initial attack vector?",
                        options: ["Phishing Link", "Credential Stuffing", "Insider Threat / Data Theft", "SQL Injection"],
                        correct: "Insider Threat / Data Theft"
                    },
                    user: {
                        label: "Which corporate identity is implicated?",
                        options: ["a.smith", "d.jones", "admin_backup", "t.stark"],
                        correct: "d.jones"
                    },
                    artifact: {
                        label: "What malicious artifact or data file was targeted?",
                        options: ["malware.exe", "Q2_Proprietary_Data.csv", "invoice.pdf.lnk", "shadow_copy.bak"],
                        correct: "Q2_Proprietary_Data.csv"
                    },
                    source: {
                        label: "Where did the threat originate or destination IP?",
                        options: ["External IP (192.0.2.115)", "Internal Workstation", "Malicious Email Domain", "Compromised VPN Pool"],
                        correct: "External IP (192.0.2.115)"
                    }
                },
                explanation: "Correct! User d.jones copied sensitive corporate files locally from the File Server and then directly exfiltrated them to an external IP address over HTTPS, bypassing endpoint controls."
            },
            {
                id: "scen-02",
                title: "Scenario 2: Ransomware Outbreak",
                description: "Alert: Multiple workstations reporting encrypted files and ransom notes. Unusual SMB traffic detected.",
                logs: {
                    proxy: [
                        "2026-06-12 09:12:05 | 10.10.4.88 -> 93.184.216.34:80 | GET /payload.exe | 200 | 1.2MB",
                        "2026-06-12 10:05:44 | 10.10.4.88 -> dev-c2-control.net:443 | ESTABLISHED | 443 | 12KB"
                    ],
                    email: [
                        "2026-06-12 08:45:00 | Inbound | From: it-support@fake-company.com | To: s.rogers@company.com | Subject: URGENT: Security Update Required | Link: http://10.10.4.88/update",
                        "2026-06-12 08:46:12 | User s.rogers clicked link in email."
                    ],
                    file_server: [
                        "2026-06-12 10:15:22 | User: s.rogers | IP: 10.10.4.88 | Write/Rename | S:\\HR\\Salaries.xlsx -> S:\\HR\\Salaries.xlsx.locked",
                        "2026-06-12 10:15:25 | User: s.rogers | IP: 10.10.4.88 | Write/Rename | S:\\HR\\Recruitment.docx -> S:\\HR\\Recruitment.docx.locked"
                    ],
                    workstations: [
                        "Host: WKSTN-88 | IP: 10.10.4.88 | Active User: s.rogers",
                        "2026-06-12 09:13:01 | Process Start: C:\\Users\\s.rogers\\Downloads\\payload.exe | PID: 4412",
                        "2026-06-12 09:14:00 | Alert: Cryptographic activity detected on C:\\Users\\s.rogers\\Documents"
                    ]
                },
                questions: {
                    vector: {
                        label: "What was the initial attack vector?",
                        options: ["Brute Force", "Spear Phishing Link", "Unsecured Wi-Fi", "USB Drop"],
                        correct: "Spear Phishing Link"
                    },
                    user: {
                        label: "Which corporate identity is implicated?",
                        options: ["d.jones", "s.rogers", "b.banner", "n.romanoff"],
                        correct: "s.rogers"
                    },
                    artifact: {
                        label: "What malicious artifact or file was executed?",
                        options: ["payload.exe", "update.zip", "invoice.pdf", "macro.docm"],
                        correct: "payload.exe"
                    },
                    source: {
                        label: "Which IP address served the malicious payload?",
                        options: ["10.10.4.88", "93.184.216.34", "192.0.2.1", "172.16.0.5"],
                        correct: "93.184.216.34"
                    }
                },
                explanation: "Correct! The incident began with a spear phishing email to s.rogers, who clicked a link to download a malicious payload. The payload then encrypted files on both the local workstation and the shared network drive."
            }
        ];

        let state = {
            currentScenarioId: scenarios[0].id,
            activeAsset: 'proxy',
            answers: {},
            isSubmitted: false
        };

        const assetLabels = {
            proxy: "Proxy Server",
            email: "Email Server",
            file_server: "File Server",
            workstations: "Workstations"
        };

        function init() {
            try {
                populateScenarioDropdown();
                loadScenario(state.currentScenarioId);
                if (window.lucide) {
                    lucide.createIcons();
                } else {
                    console.error("Lucide icons not loaded.");
                }
            } catch (err) {
                console.error("Initialization failed:", err);
                document.getElementById('scenario-desc').textContent = "Error loading simulation. Please check the console.";
            }
        }

        function populateScenarioDropdown() {
            const select = document.getElementById('scenario-select');
            if (!select) return;
            select.innerHTML = scenarios.map(s => `<option value="${s.id}">${s.title}</option>`).join('');
            select.addEventListener('change', (e) => {
                loadScenario(e.target.value);
            });
        }

        function loadScenario(id) {
            const scenario = scenarios.find(s => s.id === id);
            state.currentScenarioId = id;
            state.activeAsset = 'proxy';
            state.answers = {};
            state.isSubmitted = false;

            // Update UI
            const descEl = document.getElementById('scenario-desc');
            if (descEl) descEl.textContent = scenario.description;

            const feedbackEl = document.getElementById('feedback-section');
            if (feedbackEl) feedbackEl.classList.add('hidden');
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('submit-btn').classList.remove('opacity-50', 'cursor-not-allowed');

            renderQuestions(scenario);
            selectAsset('proxy');

            // Re-initialize icons if needed
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function renderQuestions(scenario) {
            const container = document.getElementById('questions-container');
            if (!container) return;
            container.innerHTML = Object.entries(scenario.questions).map(([key, q]) => `
                <div class="question-block" id="q-block-${key}">
                    <label class="block text-sm font-medium text-slate-300 mb-2">${q.label}</label>
                    <div class="relative">
                        <select
                            onchange="updateAnswer('${key}', this.value)"
                            id="select-${key}"
                            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                        >
                            <option value="" disabled selected>Select an answer...</option>
                            ${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                        </select>
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                        <div id="icon-${key}" class="absolute -right-8 top-1/2 -translate-y-1/2"></div>
                    </div>
                </div>
            `).join('');
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function selectAsset(assetKey) {
            state.activeAsset = assetKey;

            // Update asset cards UI
            document.querySelectorAll('.asset-card').forEach(card => {
                card.classList.remove('active');
            });
            document.getElementById(`asset-${assetKey}`).classList.add('active');

            // Update label
            document.getElementById('active-asset-label').textContent = assetLabels[assetKey];

            // Update logs
            const terminal = document.getElementById('log-terminal');
            const scenario = scenarios.find(s => s.id === state.currentScenarioId);
            const logs = scenario.logs[assetKey];

            terminal.innerHTML = logs.map(line => `<div class="mb-1 border-b border-white/5 pb-1 last:border-0">> ${line}</div>`).join('');
            terminal.scrollTop = 0;
        }

        function updateAnswer(key, value) {
            state.answers[key] = value;
        }

        function submitAnalysis() {
            const scenario = scenarios.find(s => s.id === state.currentScenarioId);
            const questionKeys = Object.keys(scenario.questions);

            let allAnswered = true;
            questionKeys.forEach(key => {
                if (!state.answers[key]) allAnswered = false;
            });

            if (!allAnswered) {
                alert("Please answer all questions before submitting.");
                return;
            }

            state.isSubmitted = true;
            let score = 0;

            questionKeys.forEach(key => {
                const select = document.getElementById(`select-${key}`);
                const iconContainer = document.getElementById(`icon-${key}`);
                const isCorrect = state.answers[key] === scenario.questions[key].correct;

                if (isCorrect) {
                    score++;
                    select.classList.remove('border-slate-700', 'border-red-500');
                    select.classList.add('border-green-500', 'bg-green-900/20');
                    iconContainer.innerHTML = '<i data-lucide="check-circle" class="text-green-500 w-5 h-5"></i>';
                } else {
                    select.classList.remove('border-slate-700', 'border-green-500');
                    select.classList.add('border-red-500', 'bg-red-900/20');
                    iconContainer.innerHTML = '<i data-lucide="x-circle" class="text-red-500 w-5 h-5"></i>';
                }
            });

            // Show feedback
            const feedbackSection = document.getElementById('feedback-section');
            const feedbackBanner = document.getElementById('feedback-banner');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackMsg = document.getElementById('feedback-msg');
            const explanationText = document.getElementById('explanation-text');

            feedbackSection.classList.remove('hidden');
            explanationText.textContent = scenario.explanation;

            if (score === questionKeys.length) {
                feedbackBanner.className = "p-4 rounded-lg border mb-4 bg-green-900/20 border-green-500 text-green-400";
                feedbackTitle.textContent = "Analysis Successful";
                feedbackMsg.textContent = `Excellent work! You identified all indicators of compromise correctly (${score}/${questionKeys.length}).`;
            } else {
                feedbackBanner.className = "p-4 rounded-lg border mb-4 bg-red-900/20 border-red-500 text-red-400";
                feedbackTitle.textContent = "Analysis Incomplete";
                feedbackMsg.textContent = `You found ${score} out of ${questionKeys.length} indicators. Review the explanation below to improve your detection skills.`;
            }

            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').classList.add('opacity-50', 'cursor-not-allowed');

            if (window.lucide) {
                lucide.createIcons();
            }

            // Scroll feedback into view
            feedbackSection.scrollIntoView({ behavior: 'smooth' });
        }

        function resetScenario() {
            loadScenario(state.currentScenarioId);
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
